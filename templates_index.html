<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bypass</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at 50% 0%, #1a1d3a 0%, #0a0b1a 60%, #05060f 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8ecf5;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    width: min(540px, 100%);
    padding: 40px 34px 32px;
    background: linear-gradient(160deg, rgba(70,80,140,0.5), rgba(30,35,70,0.85));
    border: 1px solid rgba(140,160,255,0.3);
    border-radius: 22px;
    box-shadow: 0 40px 80px -20px rgba(80,100,255,0.35), 0 20px 40px -10px rgba(0,0,0,0.8);
    backdrop-filter: blur(20px);
  }
  h1 {
    font-size: 40px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(180deg, #fff, #8ea4ff 60%, #4a5ad6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-align: center; margin-bottom: 6px;
  }
  .sub { text-align: center; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #7d89b8; margin-bottom: 26px; }
  label { display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #9aa7d8; margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%; padding: 14px 16px;
    background: rgba(10,14,32,0.75);
    border: 1px solid rgba(120,140,255,0.25);
    border-radius: 12px; color: #e8ecf5; font-size: 14px; outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: rgba(140,180,255,0.9); }
  button {
    width: 100%; margin-top: 14px;
    padding: 15px; font-size: 14px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #fff; border: none; border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(160deg, #6b8aff 0%, #3a4dcc 60%, #2a2e7a 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 10px 20px -6px rgba(90,110,255,0.7);
    transition: transform 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .status { text-align: center; margin-top: 14px; font-size: 12px; min-height: 16px; color: #9aa7d8; }
  .status.ok { color: #62d78a; }
  .status.err { color: #ff6b81; }
  .result {
    margin-top: 18px; padding: 14px 16px;
    background: rgba(10,14,32,0.75);
    border: 1px solid rgba(120,140,255,0.25);
    border-radius: 12px; font-size: 13px; word-break: break-all;
    display: none;
  }
  .result a { color: #7fb2ff; text-decoration: none; }
  .result a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <h1>BYPASS</h1>
  <div class="sub">lootlabs · shortlinks</div>

  <label for="link">Link</label>
  <input id="link" type="url" placeholder="https://loot-link.com/…">

  <button id="go">Bypass</button>
  <div class="status" id="status"></div>
  <div class="result" id="result"></div>
</div>

<script>
const $ = id => document.getElementById(id);

$("go").addEventListener("click", async () => {
  const link = $("link").value.trim();
  const st = $("status");
  const res = $("result");
  const btn = $("go");

  st.className = "status"; st.textContent = "";
  res.style.display = "none"; res.innerHTML = "";

  if (!link) { st.className = "status err"; st.textContent = "paste a link first"; return; }

  btn.disabled = true;
  st.textContent = "bypassing…";

  try {
    const r = await fetch("/api/bypass", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ link })
    });
    const j = await r.json();
    if (j.ok && j.dest) {
      st.className = "status ok";
      st.textContent = "done.";
      res.style.display = "block";
      const a = document.createElement("a");
      a.href = j.dest; a.textContent = j.dest; a.target = "_blank"; a.rel = "noopener";
      res.appendChild(a);
    } else {
      st.className = "status err";
      st.textContent = "failed: " + (j.error || "unknown");
    }
  } catch (e) {
    st.className = "status err";
    st.textContent = "error: " + e.message;
  }
  btn.disabled = false;
});
</script>
</body>
</html>
